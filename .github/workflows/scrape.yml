name: Ethiopian Job Scraper

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:          # manual trigger button in GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fixes Node.js 20 deprecation warning

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install requests beautifulsoup4 psycopg2-binary python-dotenv curl-cffi

      - name: Run scraper
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper/ethiopian_job_scraper.py --push
